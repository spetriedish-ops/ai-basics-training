<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meet your agent · AI Basics</title>
<style>
@font-face{font-family:Hand;src:url('../../../assets/fonts/PatrickHand-Regular.ttf')}
*{box-sizing:border-box}body{margin:0;background:#ede9e0;color:#474345;font:15px system-ui,sans-serif}
header,main{max-width:1440px;margin:auto;padding:20px 26px}header{padding-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.eyebrow{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:#82766a}h1{font:36px Hand;margin:3px 0 0}p{margin:4px 0;color:#776d65}
button,a{font:inherit}button{border:1px solid #c4b8a5;border-radius:7px;padding:10px 17px;background:#faf7ef;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid #468478;outline-offset:3px}button:disabled{opacity:.45;cursor:default}
.primary{background:#457b73;color:white;border-color:#457b73}.screen{position:relative;margin:auto;width:min(100%,calc((100dvh - 270px)*16/9));aspect-ratio:16/9;background:#faf7ef;box-shadow:0 16px 50px #4e453d20;overflow:hidden}
video,.still{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.still{z-index:1}video[hidden],.still[hidden]{display:none}
.screen:fullscreen{width:100%;height:100%;background:#faf7ef}.bar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:18px}.actions,.beats{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.status{font:26px Hand}.hint{font-size:12px;color:#84796d;margin-top:5px}.beats{margin-top:14px}.beats button[aria-pressed=true]{border-color:#457b73;background:#e0ece4}
a{color:#457b73;font-size:13px}.recording header,.recording .bar,.recording .beats{display:none}.recording main{padding:0;max-width:none;height:100dvh;display:grid;place-items:center}.recording .screen{width:min(100vw,calc(100dvh*16/9));box-shadow:none}
@media(max-width:700px){header,.bar{align-items:flex-start;flex-direction:column}.screen{width:100%}}
</style>
</head>
<body>
<header><div><div class="eyebrow">AI Basics · context · agent chat</div><h1>A familiar screen. A new conversation.</h1><p>A vintage monitor, a simple hello, and an agent that knows its role.</p></div><a href="../../out/agent_chat.mp4" download>Download silent MP4</a></header>
<main>
<div class="screen"><img class="still" src="poster.jpg" alt="A cartoon vintage computer with its screen off"><video muted playsinline preload="auto" aria-label="An agent introduces itself in a sketched chat interface"></video></div>
<div class="bar"><div><div class="status" aria-live="polite">Ready to power on</div><div class="hint">→ next beat · ← previous beat · Space play / pause · R replay · H hide controls · F fullscreen</div></div><div class="actions"><button id="replay">Replay</button><button id="full">Play full clip</button><button class="primary" id="next">Power on →</button><button id="fullscreen">Fullscreen</button></div></div>
<nav class="beats" aria-label="Choose a beat"><button data-beat="0" aria-pressed="false">1. Open a conversation</button><button data-beat="1" aria-pressed="false">2. Say hello</button><button data-beat="2" aria-pressed="false">3. Meet the agent</button></nav>
</main>
<script>
const beats=[{label:'Open a conversation',src:'beat-01.mp4',hold:'hold-01.mp4',poster:'hold-01.jpg',end:4},{label:'Say hello',src:'beat-02.mp4',hold:'hold-02.mp4',poster:'hold-02.jpg',end:9},{label:'Meet the agent',src:'beat-03.mp4',hold:'hold-03.mp4',poster:'hold-03.jpg',end:18.5}];
const video=document.querySelector('video'),still=document.querySelector('.still'),status=document.querySelector('.status'),next=document.querySelector('#next');
let beat=-1,mode='ready',generation=0,full=false;
// Preload native stills so the completed drawing remains visible between beats.
for(const b of beats){const img=new Image();img.src=b.poster;}
function update(){const current=full?currentBeat():beat;status.textContent=full?'Full clip':beat<0?'Ready to power on':beats[beat].label+(mode==='hold'?' · holding':'');next.textContent=current<0?'Power on →':current===0?'Say hello →':current===1?'Meet the agent →':'Scene complete';next.disabled=current===beats.length-1;document.querySelectorAll('[data-beat]').forEach(b=>b.setAttribute('aria-pressed',Number(b.dataset.beat)===beat&&!full));}
function play(){video.play().catch(()=>{status.textContent='Press Space or Replay to start';});}
function load(src,loop=false,ready=false){const token=++generation;video.pause();mode=ready?'ready':loop?'hold':'loading';update();video.loop=loop;video.src=src;video.load();video.addEventListener('loadeddata',()=>{if(token!==generation)return;video.hidden=false;still.hidden=true;mode=ready?'ready':loop?'hold':'playing';update();play();},{once:true});}
function show(index){full=false;beat=Math.max(0,Math.min(beats.length-1,index));load(beats[beat].src);}
function hold(index){beat=index;full=false;still.src=beats[index].poster;still.alt=beats[index].label+' — completed sketch';still.hidden=false;video.hidden=true;load(beats[index].hold,true);}
function currentBeat(){return full?(beats.findIndex(b=>video.currentTime<b.end)===-1?beats.length-1:beats.findIndex(b=>video.currentTime<b.end)):beat;}
function advance(){const current=currentBeat();if(current<beats.length-1)show(current+1);}
function replay(){full?playFull():show(Math.max(0,beat));}
function playFull(){full=true;beat=-1;load('../../out/agent_chat.mp4?v=2');}
video.addEventListener('ended',()=>{if(mode!=='hold'&&mode!=='ready')hold(full?beats.length-1:beat);});
video.addEventListener('timeupdate',()=>{if(full)update();});
video.addEventListener('error',()=>{status.textContent='Video could not load. Open this player alongside its animation files.';still.hidden=false;});
next.onclick=advance;document.querySelector('#replay').onclick=replay;document.querySelector('#full').onclick=playFull;
document.querySelectorAll('[data-beat]').forEach(b=>b.onclick=()=>show(Number(b.dataset.beat)));
function fullscreen(){document.fullscreenElement?document.exitFullscreen():document.querySelector('.screen').requestFullscreen().catch(()=>{});}
document.querySelector('#fullscreen').onclick=fullscreen;
window.addEventListener('keydown',e=>{if(e.target.closest('button,a')&&e.key===' ')return;if(e.key===' '){e.preventDefault();mode==='ready'?replay():video.paused?play():video.pause();}else if(e.key==='ArrowRight'){e.preventDefault();advance();}else if(e.key==='ArrowLeft'){e.preventDefault();show(Math.max(0,currentBeat()-1));}else if(e.key.toLowerCase()==='r')replay();else if(e.key.toLowerCase()==='h')document.body.classList.toggle('recording');else if(e.key.toLowerCase()==='f')fullscreen();});
video.hidden=true;update();load('ready.mp4',true,true);
</script>
</body>
</html>
